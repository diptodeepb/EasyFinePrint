services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: easyfineprint-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard with MongoDB Atlas M0 URI
      - key: MONGODB_DB
        value: easyfineprint
      - key: GEMINI_API_KEY
        sync: false # Set in Render Dashboard with Gemini API key
      - key: GEMMA_MODEL
        value: gemma-4-26b-a4b-it
      - key: ENVIRONMENT
        value: production
      - key: SERPAPI_ENABLED
        value: "false"
      - key: SERPAPI_API_KEY
        sync: false # Optional: Set if using SerpApi discovery
      - key: SERPAPI_MONTHLY_CAP
        value: "200"
      - key: SERPAPI_HOURLY_CAP
        value: "40"
      - key: SENTRY_DSN
        sync: false # Optional: Set if error telemetry is enabled
      - key: FRONTEND_ORIGIN
        value: https://easyfineprint.onrender.com

  # ---------------------------------------------------------------------------
  # 2. Vite React Frontend Static Site
  # ---------------------------------------------------------------------------
  - type: web
    name: easyfineprint
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: VITE_API_URL
        value: https://easyfineprint-backend.onrender.com
      - key: VITE_SENTRY_DSN
        sync: false # Optional: Set in Render Dashboard for frontend error tracking
