<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Minimalist Black & White Container -->
  <rect width="64" height="64" rx="14" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>

  <!-- Scale of Justice (⚖️) Architecture -->
  <!-- Fulcrum Top Ring -->
  <circle cx="32" cy="14" r="2.5" fill="#ffffff"/>

  <!-- Central Mast & Solid Base -->
  <line x1="32" y1="16.5" x2="32" y2="48" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="22" y1="48" x2="42" y2="48" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Horizontal Balance Beam -->
  <line x1="15" y1="20" x2="49" y2="20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Left Scale Pan -->
  <line x1="15" y1="20" x2="9" y2="30" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="15" y1="20" x2="21" y2="30" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M7 30 C7 36 23 36 23 30 Z" fill="#18181b" stroke="#ffffff" stroke-width="1.75" stroke-linejoin="round"/>

  <!-- Right Scale Pan -->
  <line x1="49" y1="20" x2="43" y2="30" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="49" y1="20" x2="55" y2="30" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M41 30 C41 36 57 36 57 30 Z" fill="#18181b" stroke="#ffffff" stroke-width="1.75" stroke-linejoin="round"/>

  <!-- Central Verification Seal (✅) -->
  <circle cx="32" cy="34" r="8" fill="#09090b" stroke="#ffffff" stroke-width="2"/>
  <path d="M28 34 L30.8 36.8 L36 31.5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>