<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>EasyFinePrint</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var isDark = true;
          if (saved === 'light') {
            isDark = false;
          } else if (saved === 'dark') {
            isDark = true;
          } else {
            // 'system' or default
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            var metaDark = document.querySelector('meta[name="theme-color"]');
            if (metaDark) metaDark.setAttribute('content', '#09090b');
          } else {
            document.documentElement.classList.remove('dark');
            var metaLight = document.querySelector('meta[name="theme-color"]');
            if (metaLight) metaLight.setAttribute('content', '#ece5d8');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
